[pytest]
minversion = 7.0

# Where tests live
testpaths = tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Output / UX
addopts =
    -ra
    -q
    --strict-markers
    --disable-warnings

# Custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests
    unit: marks unit tests

# Environment variables for tests
env =
    ENV=test
