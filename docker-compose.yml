name: fidel

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fidel-api
    image: fidel-api:1.0.0
    env_file:
      - .env
    environment:
      # Ensure these exist even if .env is missing them
      ENV: ${ENV:-dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/fidel}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-redis://redis:6379/0}
      HISTORY_CACHE_TTL_S: ${HISTORY_CACHE_TTL_S:-60}
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:-http://fidel-inference:7890}
      JWT_SECRET: ${JWT_SECRET:-changeme}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - .:/app
    command: bash -lc "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - net

  db:
    image: postgres:latest
    container_name: fidel-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fidel}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-fidel}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - net

  adminer:
    image: adminer:latest
    container_name: fidel-adminer
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    restart: unless-stopped
    networks:
      - net

  redis:
    image: redis:latest
    container_name: fidel-redis
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - net

volumes:
  pgdata:

networks:
  net:
