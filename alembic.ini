[alembic]
# Path to migration scripts
script_location = app/db/migrations

# This is REQUIRED but will be overridden from env.py
sqlalchemy.url = driver://user:pass@localhost/dbname

# File naming (nice & readable)
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Prepend path to sys.path
prepend_sys_path = .

# Use timezone-aware timestamps
timezone = UTC

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
